# Electron runtime libraries for Solenta's Linux build (Mode A: Solenta's Remote Connections
# installs it over SSH and checks it with ldd). All already arrive with Chromium and Playwright's
# deps; listed so they stay if those ever change. Trixie names (t64 ABI renames verified with
# apt-cache on Debian 13): libgtk-3-0t64, libasound2t64, libatk1.0-0t64, libatk-bridge2.0-0t64,
# libatspi2.0-0t64, libcups2t64, libglib2.0-0t64.
#
# xvfb, xauth: Solenta 0.26's Linux build always creates a BrowserWindow, even with --headless;
# Electron 35 SIGSEGVs trying to create that window when no X display exists (verified with gdb).
# agentos-solenta-xvfb.service runs Xvfb on :99 so agentos-solenta.service has a display.
[Content]
Packages=
        xvfb
        xauth
        libnss3
        libnspr4
        libgtk-3-0t64
        libgbm1
        libasound2t64
        libatk1.0-0t64
        libatk-bridge2.0-0t64
        libatspi2.0-0t64
        libcups2t64
        libdrm2
        libxkbcommon0
        libxcomposite1
        libxdamage1
        libxrandr2
        libxfixes3
        libpango-1.0-0
        libcairo2
        libdbus-1-3
        libexpat1
        libxext6
        libx11-6
        libxcb1
        libglib2.0-0t64
