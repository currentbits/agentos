[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
Repositories=main,contrib,non-free,non-free-firmware

[Output]
ImageId=agentos-installer
Format=disk
OutputDirectory=../mkosi.output
# ElTorito=yes built fine (systemd-repart v262 in the reused tools tree supports it), but booted as a
# CD, GRUB does not find its config/ESP and drops to a rescue prompt (its early config is a
# `search --file /grub/grub.cfg`). The exact cause was not investigated. The installer is USB-only
# for now; USB boot is unaffected. SKIP_CD=1 for tests.
ElTorito=no

[Build]
ToolsTree=../mkosi.tools

[Content]
Bootable=yes
Bootloader=grub-signed
ShimBootloader=signed
UnifiedKernelImages=none
BiosBootloader=none
KernelCommandLine=console=ttyS0 console=tty0
Hostname=agentos-installer
Locale=C.UTF-8
Timezone=UTC
Ssh=never
WithDocs=no
WithRecommends=no
ExtraTrees=../mkosi.output/installer-payload
Packages=
        linux-image-amd64
        amd64-microcode
        intel-microcode
        firmware-realtek
        firmware-bnx2
        firmware-bnx2x
        firmware-qlogic
        firmware-misc-nonfree
        systemd
        systemd-sysv
        systemd-resolved
        udev
        grub-efi-amd64-bin
        grub-efi-amd64-signed
        shim-signed
        whiptail
        zstd
        gdisk
        util-linux
        e2fsprogs
        dosfstools
        curl
        ca-certificates
        openssl
        iproute2
        passwd
        kmod
        less
