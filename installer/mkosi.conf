[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
Repositories=main,contrib,non-free,non-free-firmware

[Output]
ImageId=agentos-installer
Format=disk
OutputDirectory=../mkosi.output
# El Torito (systemd-repart >= 261): the same image also boots as a (virtual) CD. Two CD-only pieces:
# - GRUB: the Debian-signed GRUB has no embedded search config (mkosi only writes ESP:/EFI/debian/grub.cfg
#   = `configfile /grub/grub.cfg`); booted as a CD its root is the whole CD, (cd0), whose ISO9660 view
#   repart leaves empty. mkosi.postoutput adds /EFI/debian/grub.cfg to that ISO9660 view: it selects this
#   ESP by FAT volume UUID and sets agentos_cdargs (used in KernelCommandLine= below; empty on USB).
# - initrd: Linux exposes no partitions on sr* and the GPT has 512-byte sectors; mkosi.initrd.conf/ adds a
#   unit that loop-attaches the CD (-P -b 512 -r) on CD boots only. The CD root is read-only, so
#   agentos_cdargs adds systemd.volatile=overlay.
ElTorito=yes

[Build]
ToolsTree=../mkosi.tools

[Content]
Bootable=yes
Bootloader=grub-signed
ShimBootloader=signed
UnifiedKernelImages=none
BiosBootloader=none
# ${agentos_cdargs}: a GRUB variable, set only on a CD boot (mkosi.postoutput); copied verbatim into grub.cfg.
KernelCommandLine=console=ttyS0 console=tty0 ${agentos_cdargs}
Hostname=agentos-installer
Locale=C.UTF-8
Timezone=UTC
Ssh=never
WithDocs=no
WithRecommends=no
ExtraTrees=../mkosi.output/installer-payload
Packages=
        linux-image-amd64
        amd64-microcode
        intel-microcode
        firmware-realtek
        firmware-bnx2
        firmware-bnx2x
        firmware-qlogic
        firmware-misc-nonfree
        systemd
        systemd-sysv
        systemd-resolved
        udev
        grub-efi-amd64-bin
        grub-efi-amd64-signed
        shim-signed
        whiptail
        zstd
        gdisk
        util-linux
        e2fsprogs
        dosfstools
        curl
        ca-certificates
        openssl
        iproute2
        passwd
        login
        kmod
        less
