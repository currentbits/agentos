[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
Repositories=main,contrib,non-free,non-free-firmware

[Output]
ImageId=agentos
Format=disk
OutputDirectory=mkosi.output
ManifestFormat=json

[Build]
ToolsTree=default
WithNetwork=yes
SandboxTrees=apt:/etc/apt

[Content]
SkeletonTrees=apt:/etc/apt
Bootable=yes
Bootloader=grub-signed
BiosBootloader=grub
ShimBootloader=signed
UnifiedKernelImages=none
KernelCommandLine=console=ttyS0 console=tty0
Hostname=agentos
Locale=C.UTF-8
Timezone=UTC
Ssh=never
WithDocs=no
RemoveFiles=/etc/ssh/ssh_host_*
            /var/lib/apt/lists/*
            /var/cache/apt/*.bin
            /home/agent/.npm
            /home/agent/.cargo/registry
            /home/agent/.bun/install/cache
