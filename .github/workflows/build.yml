name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # weekly rebuild, Monday 03:17 UTC
  workflow_dispatch:

# Read-only by default (and always for PRs). Only the release job, which never runs for
# pull requests and never runs the build's third-party installers, gets write scopes.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    outputs:
      version: ${{ steps.ver.outputs.v }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache

      - name: Host setup
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf cloud-image-utils mtools pipx shellcheck zstd
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo chmod 666 /dev/kvm
          pipx install "git+https://github.com/systemd/mkosi@v27"
          df -h /

      - name: Lint and unit tests
        run: |
          shellcheck -S warning test/smoke.sh test/checks/*.sh test/env_test.sh tools/*.sh mkosi.prepare.chroot mkosi.finalize.chroot \
            mkosi.extra/usr/local/bin/* mkosi.extra/usr/local/sbin/* mkosi.extra/usr/local/lib/agentos/*.sh \
            mkosi.extra/etc/profile.d/agentos.sh \
            tools/build-installer.sh test/installer-boot-test.sh test/install-test.sh installer/mkosi.extra/usr/local/sbin/* \
            installer/mkosi.extra/usr/lib/agentos-installer/lib.sh
          test/env_test.sh
          test/installer_test.sh
          python3 test/computer_test.py

      - name: Build image
        run: mkosi -f build

      - name: Smoke test (UEFI + BIOS + UEFI without cloud-init seed)
        env:
          TMPDIR: ${{ runner.temp }}
        run: test/smoke.sh mkosi.output/agentos.raw uefi bios uefi-noseed

      - name: Build installer
        run: tools/build-installer.sh

      - name: Installer boot test (USB; El Torito CD boot is disabled, see installer/mkosi.conf)
        run: SKIP_CD=1 test/installer-boot-test.sh mkosi.output/agentos-installer.raw

      - name: Installer end-to-end test
        run: TMPDIR=${{ runner.temp }} test/install-test.sh mkosi.output/agentos-installer.raw

      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else echo "v=$(date -u +%Y.%m.%d)" >> "$GITHUB_OUTPUT"; fi

      - name: Convert
        if: github.event_name != 'pull_request'
        run: tools/convert.sh mkosi.output/agentos.raw "${{ steps.ver.outputs.v }}" release mkosi.output/agentos-installer.raw

      - name: Hand release files to the release job
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: release/
          retention-days: 1
          compression-level: 0   # already compressed

  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # gh release create/upload
      id-token: write       # attestation signing
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: release

      # SHA256SUMS holds whole-file digests (taken before oversized images were split), so the
      # attestation covers the reassembled images users actually verify and boot.
      - name: Attest provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-checksums: release/SHA256SUMS

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v${{ needs.build.outputs.version }}"
          # README-download.txt is uploaded as an asset (it is listed in SHA256SUMS) and also
          # prepended to the release notes, together with the package manifest.
          cat release/README-download.txt release/MANIFEST.txt > release-notes.txt
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target "$GITHUB_SHA" --title "AgentOS $tag" --notes-file release-notes.txt
          gh release upload "$tag" release/* --clobber
