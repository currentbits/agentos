name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # weekly rebuild, Monday 03:17 UTC
  workflow_dispatch:

# Read-only by default (and always for PRs). Only the release job, which never runs for
# pull requests and never runs the build's third-party installers, gets write scopes.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    outputs:
      version: ${{ steps.ver.outputs.v }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache

      - name: Host setup
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf cloud-image-utils mtools pipx shellcheck zstd tmux jq apt-utils
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo chmod 666 /dev/kvm
          pipx install "git+https://github.com/systemd/mkosi@v27"
          df -h /

      - name: Lint and unit tests
        run: |
          shellcheck -S warning test/smoke.sh test/checks/*.sh test/env_test.sh tools/*.sh mkosi.prepare.chroot mkosi.finalize.chroot \
            package/usr/local/bin/* package/usr/local/sbin/* package/usr/local/lib/agentos/*.sh \
            package/etc/profile.d/agentos.sh \
            package/usr/local/lib/agentos/web-serve test/web_serve_test.sh \
            package/usr/local/lib/agentos/{cli-wrapper,register-mcp,solenta-pair,solenta-start} \
            package/usr/local/lib/agentos/ci/post-receive tools/solenta-bridge \
            package/usr/local/lib/agentos/configure package/usr/local/lib/agentos/migrations/*.sh package/DEBIAN/postinst \
            package/etc/update-motd.d/60-agentos-update \
            test/wrapper_test.sh test/solenta_pair_test.sh test/bridge_test.sh \
            test/configure_test.sh test/register_mcp_test.sh test/migration_001_test.sh test/apt_publish_test.sh test/update_check_test.sh \
            tools/build-installer.sh test/installer-boot-test.sh test/install-test.sh installer/mkosi.extra/usr/local/sbin/* \
            installer/mkosi.extra/usr/lib/agentos-installer/lib.sh
          test/env_test.sh
          test/installer_test.sh
          python3 test/computer_test.py
          test/web_serve_test.sh
          test/wrapper_test.sh
          test/solenta_pair_test.sh
          test/bridge_test.sh
          test/configure_test.sh
          test/register_mcp_test.sh
          test/migration_001_test.sh
          test/apt_publish_test.sh
          test/update_check_test.sh

      - name: agentos-ci unit tests
        run: |
          python3 -m venv "$RUNNER_TEMP/ci-venv"
          "$RUNNER_TEMP/ci-venv/bin/pip" install -q pytest 'pyyaml>=6,<7' 'mcp>=1.28,<2'
          "$RUNNER_TEMP/ci-venv/bin/python" -m pytest -q test/ci

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Web UI unit tests
        run: |
          (cd web/server && npm ci && npm run typecheck && npx vitest run)
          (cd web/ui && npm ci && npx vitest run && npm run build)

      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; echo "deb=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else echo "v=$(date -u +%Y.%m.%d)" >> "$GITHUB_OUTPUT"; echo "deb=0.0.0~git$(date -u +%Y%m%d).${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"; fi

      # A tag must build a release package (repo URL and signing key set, tools/build-deb.sh fails
      # otherwise); every other build may be a development build with the AgentOS source disabled.
      - name: Build the agentos package
        env:
          AGENTOS_VERSION: ${{ steps.ver.outputs.deb }}
          AGENTOS_DEV: ${{ startsWith(github.ref, 'refs/tags/v') && '0' || '1' }}
        run: tools/build-deb.sh

      - name: Build image
        run: mkosi -f build

      - name: Smoke test (UEFI + BIOS + UEFI without cloud-init seed)
        env:
          TMPDIR: ${{ runner.temp }}
        run: test/smoke.sh mkosi.output/agentos.raw uefi bios uefi-noseed

      - name: Build installer
        run: tools/build-installer.sh

      - name: Installer boot test (USB and El Torito CD)
        run: test/installer-boot-test.sh mkosi.output/agentos-installer.raw

      - name: Installer boot test with Secure Boot (Microsoft keys enrolled)
        run: SECUREBOOT=1 test/installer-boot-test.sh mkosi.output/agentos-installer.raw

      - name: Installer end-to-end test
        run: TMPDIR=${{ runner.temp }} test/install-test.sh mkosi.output/agentos-installer.raw

      - name: Installer end-to-end test from a virtual CD (El Torito)
        run: TMPDIR=${{ runner.temp }} INSTALL_MEDIA=cd test/install-test.sh mkosi.output/agentos-installer.raw

      - name: Convert
        if: github.event_name != 'pull_request'
        run: tools/convert.sh mkosi.output/agentos.raw "${{ steps.ver.outputs.v }}" release mkosi.output/agentos-installer.raw

      - name: Hand release files to the release job
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: release/
          retention-days: 1
          compression-level: 0   # already compressed

      - name: Hand the agentos package to the release job
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deb
          path: mkosi.packages/agentos_*_amd64.deb
          retention-days: 1
          compression-level: 0

  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    # Serializes the gh-pages publish below against any other release job (another tag pushed
    # while this one is running); it must not cancel one of two tags racing to publish.
    concurrency:
      group: apt-publish
      cancel-in-progress: false
    permissions:
      contents: write       # gh release create/upload
      id-token: write       # attestation signing
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: release

      # SHA256SUMS holds whole-file digests (taken before oversized images were split), so the
      # attestation covers the reassembled images users actually verify and boot.
      - name: Attest provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-checksums: release/SHA256SUMS

      # Checked out and checked before the GitHub release is created below: a missing key or
      # notes file should fail the workflow before there is a release to clean up by hand.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          persist-credentials: false
          path: src
      - name: Check apt publish prerequisites
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          AGENTOS_APT_KEY: ${{ secrets.AGENTOS_APT_KEY }}
          V: ${{ needs.build.outputs.version }}
        run: |
          [ -n "$AGENTOS_APT_KEY" ] || { echo "the AGENTOS_APT_KEY secret is not set (docs/updates.md, owner steps)" >&2; exit 1; }
          [ -s "src/docs/releases/$V.md" ] || { echo "write src/docs/releases/$V.md (what's new in $V) and tag again" >&2; exit 1; }

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v${{ needs.build.outputs.version }}"
          # README-download.txt is uploaded as an asset (it is listed in SHA256SUMS) and also
          # prepended to the release notes, together with the package manifest.
          cat release/README-download.txt release/MANIFEST.txt > release-notes.txt
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target "$GITHUB_SHA" --title "AgentOS $tag" --notes-file release-notes.txt
          gh release upload "$tag" release/* --clobber

      # The apt repo on gh-pages (docs/updates.md). Tags only; the signing key is used here and
      # nowhere else. Fails closed: no key, no notes, a development build or a foreign keyring.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: deb
          path: deb
      - name: Publish the package to the apt repo (gh-pages)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          AGENTOS_APT_KEY: ${{ secrets.AGENTOS_APT_KEY }}
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.build.outputs.version }}
        run: |
          shopt -s nullglob
          debs=(deb/agentos_*_amd64.deb)
          [ "${#debs[@]}" -eq 1 ] || { echo "expected exactly one deb/agentos_*_amd64.deb, found ${#debs[@]}" >&2; exit 1; }
          notes=src/docs/releases/$V.md
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 700 "$GNUPGHOME"
          printf '%s\n' "$AGENTOS_APT_KEY" | gpg --batch --quiet --import
          repo="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # A clone failure must not silently become a fresh (empty) repo: only "branch does not
          # exist yet" (ls-remote --exit-code exit 2) does; any other failure fails the step.
          before=""
          if sha=$(git ls-remote --exit-code --heads "$repo" gh-pages); then
            before=${sha%%$'\t'*}
            git clone --quiet --depth 1 --branch gh-pages "$repo" site
          else
            rc=$?
            [ "$rc" -eq 2 ] || { echo "git ls-remote gh-pages failed (exit $rc)" >&2; exit 1; }
            git init --quiet -b gh-pages site
            git -C site remote add origin "$repo"
          fi
          src/tools/apt-publish.sh "${debs[0]}" "$notes" site
          # One commit, force-pushed: pruned versions leave nothing behind in the branch's history.
          # --force-with-lease refuses if gh-pages moved since the clone/ls-remote above (a
          # concurrent publish); an empty $before means it must still not exist.
          cd site
          git checkout --quiet --orphan publish
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit --quiet -m "apt: agentos $V"
          git push --quiet --force-with-lease="gh-pages:$before" origin publish:gh-pages
