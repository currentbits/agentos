d /run/agentos           0755 root  root  -
d /run/agentos/vnc       0750 root  agent -
d /run/agentos/desktops  0750 agent agent -

# agentos-update: one run at a time (root's --check and agent's update share it); a second lock
# for check-vs-check exclusion only, so a check in progress never looks like an update to the web
# UI's "running" probe (which watches only the first lock); and the last run's log, which the web
# UI shows after agentos-web restarted mid-update.
f /run/lock/agentos-update.lock       0644 agent agent -
f /run/lock/agentos-update-check.lock 0644 agent agent -
f /var/log/agentos-update.log         0644 agent agent -
# No separate "z" line needed to heal /var/log/agentos-update.log's ownership: tmpfiles.d(5) --
# "By default the access mode of listed inodes is set to the specified mode regardless if it is
# created anew, or already existed" (same wording for user/group) -- a plain "f" (no ":" prefix)
# already re-applies owner and mode on every "systemd-tmpfiles --create" run, even if the file
# already exists owned by someone else (e.g. created under root before "agent" existed, or by a
# root cron before this file existed). Verified: test/checks/99-update.sh's
# check_update_log_ownership_self_heals chowns it to root, re-runs --create, and asserts it's back
# to agent:agent 644 with only the "f" line present.
